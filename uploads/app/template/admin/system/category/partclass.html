<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script data-cfasync="false" src="../../../admin/header.js?v=20260825a"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
    <div id="schollfl" class="moduleElenAl">
        <div class="moduleSeachs">
            <div class="">{{ lc('admin_system_00125') }}</div>
            <div class="nrtopbtn">
                <el-button type="primary" icon="el-icon-document-add" size="mini"
                    @click="addVisible = true">{{ lc('admin_00197') }}</el-button>
            </div>
        </div>
        <div class="moduleElTable">
            <el-table :data="tableData" stripe border style="width: 100%;" height="100%"
                :header-cell-style="{ background: '#f5f7fa', color: '#606266' }" ref="multipleTable"
                @selection-change="handleSelectionChange" v-loading="loading" :empty-text="emptytext">
                <el-table-column type="selection" width="55"></el-table-column>
                <el-table-column prop="id" :label="lc('admin_system_00098')" width="180">
                </el-table-column>
                <el-table-column :label="lc('admin_system_00097')" property="name">
                    <template slot-scope="scope">
                        <el-input v-if="scope.row[scope.column.property + 'isShow']"
                            :ref="scope.column.property + scope.$index" :id="scope.column.property + scope.$index"
                            v-model="scope.row.name" @blur="alterData(scope)"></el-input>
                        <span v-else>
                            {{ lc("admin_level1_category_value", [scope.row.name]) }}<img @click="editData(scope)" class="editIcon"
                                src="../../../admin/images/bine.png" alt="" style="margin-left: 4px;" width="14" height="14">
                        </span>
                    </template>
                </el-table-column>
                <el-table-column prop="variable" :label="lc('admin_system_00123')"></el-table-column>
                <el-table-column fixed="right" :label="lc('member_user_00048')" width="140">
                    <template slot-scope="scope">
                        <div class="cz_button">
                            <el-button size="mini" @click="openManage(scope)">{{ lc('wap_com_00304') }}</el-button>
                            <el-button size="mini" type="danger" @click="deleteRow(scope)">{{ lc('wap_js_00077') }}</el-button>
                        </div>
                    </template>
                </el-table-column>
            </el-table>
        </div>
        <div class="modulePaging">
            <div class="">
                <div class="modulecz modulePagButn">
                    <el-checkbox :indeterminate="isIndeterminate" v-model="checked" @change="selectAllBottom">{{ lc('wap_js_00074') }}</el-checkbox>
                    <el-button @click="deleteRow(null, true)" size="mini">{{ lc('member_com_00055') }}</el-button>
                </div>
            </div>
        </div>

        <el-dialog :title="lc('admin_system_00125')" width="40%" :visible.sync="addVisible" :modal-append-to-body="false">
            <partclass_add :position="tableData" @child-event-getlist="getList"></partclass_add>
        </el-dialog>
        <div class="modluDrawer">
            <el-drawer :title="lc('wap_com_00304')" :visible.sync="manageVisible" :append-to-body="true"
                :modal-append-to-body="false" :show-close="true" :destroy-on-close="true" size="800px">
                <partclass_manage :id="info.id" @child-event-getlist="getList"></partclass_manage>
            </el-drawer>
        </div>
    </div>
</body>
<script>
    const custoapp = new Vue({
        el: '#schollfl',
        data: function () {
            return {
                emptytext: window.lc('wap_js_00113'),
                loading: false,
                tableData: [], //表格数据
                checked: false,
                isIndeterminate: false,// checkbox 的不确定状态
                selectedItem: [],
                addVisible: false,
                oldData: null,
                info: {},
                manageVisible: false,
                
            }
        },
        mounted() {
            this.getList();
        },
        methods: {
            handleSelectionChange(val) {
                this.selectedItem = val;
                if (this.selectedItem.length == 0) {
                    this.isIndeterminate = false;
                    this.checked = false;
                } else {
                    if (this.selectedItem.length == this.tableData.length) {
                        this.isIndeterminate = false;
                        this.checked = true;
                    } else {
                        this.isIndeterminate = true;
                        this.checked = false;
                    }
                }
            },
            selectAllBottom(value) {
                value ? this.$refs.multipleTable.toggleAllSelection() : this.$refs.multipleTable.clearSelection();
            },
            getList() {
                this.addVisible = false;
                let _this = this;
                _this.loading = true;
                _this.emptytext = window.lc('admin_user_weipin_00026');
                httpPost('m=system&c=category_partclass&a=index').then(function (response) {
                    let res = response.data;
                    _this.tableData = res.data;
                    _this.loading = false;
                    if (_this.tableData.length === 0){
                        _this.emptytext = window.lc('wap_js_00113');
                    }
                }).catch(function (error) {
                    console.log(error);
                });
            },
            deleteRow(scope, isMore) {
                let params = {};
                if (isMore) {
                    if (!this.selectedItem.length) {
                        message.error(window.lc('admin_user_weipin_00005'));
                        return false;
                    }
                    let list = [];
                    for (let item of this.selectedItem) {
                        list.push(item.id);
                    }
                    params.delType = 'more';
                    params.del = list;
                } else {
                    // let index = scope.$index;
                    // this.tableData.splice(index, 1);
                    params.delType = 'single';
                    params.delid = scope.row.id;
                }

                delConfirm(this, params, this.delete);
            },
            delete(params) {
                let _this = this;
                httpPost('m=system&c=category_partclass&a=del', params).then(function (response) {
                    let res = response.data;
                    if (res.error === 0) {
                        message.success(window.lc('admin_user_00187'));
                        _this.getList();
                    } else {
                        message.error(window.lc('admin_user_00186'));
                    }
                }).catch(function (error) {
                    console.log(error);
                });
            },
            editData(scope) {
                let index = scope.$index;
                let row = scope.row;
                let column = scope.column;
                this.oldData = JSON.parse(JSON.stringify(row));
                let copyRow = JSON.parse(JSON.stringify(row));
                copyRow[column.property + "isShow"] = true;
                this.$set(this.tableData, index, copyRow);
                this.$nextTick(() => {
                    let ref = column.property + index;
                    $("#" + ref).focus();
                });
            },
            alterData(scope) {
                if (this.oldData == null) {
                    return false;
                }
                let index = scope.$index;
                let row = scope.row;
                let column = scope.column;
                let copyRow = JSON.parse(JSON.stringify(row));
                copyRow[column.property + "isShow"] = false;
                this.$set(this.tableData, index, copyRow);
                if (row[column.property] === this.oldData[column.property]) {
                    return false;
                }
                let _this = this;
                let sendData = { id: row.id };
                sendData[column.property] = row[column.property];
                httpPost('m=system&c=category_partclass&a=ajax', sendData, { hideloading: true }).then(function (response) {
                    let res = response.data;
                    if (res.error === 0) {
                        message.success(window.lc('admin_user_company_00208'));
                    } else {
                        message.error(window.lc('admin_00187'));
                    }
                    _this.oldData = null;
                    _this.getList();
                }).catch(function (error) {
                    console.log(error);
                });
            },
            openManage(scope) {
                this.info = scope.row;
                this.manageVisible = true;
            }
        },
        components: {
            'partclass_add': httpVueLoader('./component/partclass_add.vue'),
            'partclass_manage': httpVueLoader('./component/partclass_manage.vue'),
        }
    });
</script>

</html>
