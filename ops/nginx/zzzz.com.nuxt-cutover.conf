server
{
    listen 80;
    server_name test-jobs.ov6.com;
    # 不再把 HTML 指到 PHP 源码树；uploads 仅保留用户文件 alias
    client_max_body_size 25m;

    include /www/server/panel/vhost/nginx/extension/zzzz.com/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/zzzz.com.conf;
    #CERT-APPLY-CHECK--END

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ^~ /yapi/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /yapi;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Cookie            $http_cookie;
        proxy_pass_request_headers on;
        proxy_set_header Accept-Encoding   "";
        client_max_body_size 25m;
        client_body_buffer_size 1m;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        sub_filter '"/api-docs/' '"/yapi/api-docs/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/html application/json;
        access_log /www/wwwlogs/zzzz.com-yapi.log;
    }

    location /callback/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /data/upload/ {
        alias /www/wwwroot/zzzz.com/uploads/data/upload/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
    }

    access_log  /www/wwwlogs/zzzz.com.log;
    error_log  /www/wwwlogs/zzzz.com.error.log;
}
