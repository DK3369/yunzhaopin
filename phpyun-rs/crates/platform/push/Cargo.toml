[package]
name = "phpyun-push"
version.workspace = true
edition.workspace = true

# The transport-agnostic half of server-initiated delivery: who is connected to
# this instance, what they are allowed to receive, and how a push written on one
# instance reaches a session held by another. WebSocket and SSE are two renderings
# of the same stream and both sit on top of this.
