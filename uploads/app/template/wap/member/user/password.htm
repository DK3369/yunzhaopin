{yun:}include file="$wapstyle/member/header.htm"{/yun}
<style type="text/css">
    body{font-size: 14px !important;}
</style>
<div id="yunvue" class="none">
	<form id="password_form">
		<div class="verification_form">
			<div class="verification_formname">{yun:}t key='wap_01096'{/yun}</div>
			<div class="verification_form_code">
				<input type="password" name="oldpwd" value="" placeholder="{yun:}t key='wap_01097'{/yun}"/>
			</div>
		
			<div class="verification_formname">{yun:}t key='wap_user_00305'{/yun}</div>
		 	<div class="verification_form_code">
				<input  type="password" name="newpwd" value="" :placeholder="regpwplaceholder"/>
			</div>
			<div class="verification_formname">{yun:}t key='wap_01098'{/yun}</div>
			<div class="verification_form_code">
				<input type="password" name="confirmpwd" value="" :placeholder="regpwplaceholder"/>
			</div>
	  		<div class="verification_form_btn" @click="savePassword">{yun:}t key='wap_js_00094'{/yun}</div>
	  	</div>
	</form>
</div>

<script>  

var yunvue = new Vue({
    el: '#yunvue',
    data: {
        regpwplaceholder:'',
        i18n: {
            newPasswordPrefix: '{yun:}t key='wap_01099'{/yun}',
            mustInclude: '{yun:}t key='wap_user_00306'{/yun}',
            num: '{yun:}t key='common_01997'{/yun}',
            zm: '{yun:}t key='common_01973'{/yun}',
            sp: '{yun:}t key='common_01697'{/yun}(!@#.$-_)',
            fillOldPassword: '{yun:}t key='wap_01100'{/yun}',
            fillNewPassword: '{yun:}t key='wap_01101'{/yun}',
            fillConfirmPassword: '{yun:}t key='wap_01102'{/yun}',
            sameAsOldPassword: '{yun:}t key='wap_01103'{/yun}',
            confirmMismatch: '{yun:}t key='wap_01104'{/yun}',
            passwordLengthError: '{yun:}t key='wap_js_00045'{/yun}',
            submitting: '{yun:}t key='wap_js_00158'{/yun}',
        },
    },
    created() {   
        this.getCon();
    },
    methods:{          
        getCon:function(){
            showLoading();
            var that = this;
            $.post('{yun:}url d=wxapp m=register c=getCon{/yun}',{rander: Math.random()},function(data){
                hideLoading();      
               	var con = data.data;
					
				var reg_pw_sp  = con.reg_pw_sp,
					reg_pw_zm  = con.reg_pw_zm,
					reg_pw_num = con.reg_pw_num;
				
				var regpwplaceholder = that.i18n.newPasswordPrefix;
				if(reg_pw_sp=='1' || reg_pw_num=='1' || reg_pw_zm=='1'){
					regpwplaceholder += that.i18n.mustInclude;
					
					if (reg_pw_num=='1'){
						regpwplaceholder += that.i18n.num + " ";
					}
					if (reg_pw_zm=='1'){
						regpwplaceholder += that.i18n.zm + " ";
					}
					if (reg_pw_sp=='1'){
						regpwplaceholder += that.i18n.sp;
					}
				}
				that.regpwplaceholder = regpwplaceholder;
                $("#yunvue").css('display', 'block');
            },'json');            
        },         
        savePassword:function(){
            var that = this;
			var formData = {};
			var v = getFormValue('password_form');
			if (v.oldpwd == '') {
				return showToast(that.i18n.fillOldPassword);
			}

			formData.password = v.oldpwd;

			if (v.newpwd == '') {
				return showToast(that.i18n.fillNewPassword);
			}else if(v.newpwd.length < 6 || v.newpwd.length > 20) {
				return showToast(that.i18n.passwordLengthError);
				
			}

			formData.passwordnew = v.newpwd;

			if (v.confirmpwd == '') {
				return showToast(that.i18n.fillConfirmPassword);
			}

			if (v.oldpwd == v.newpwd) {
				return showToast(that.i18n.sameAsOldPassword);
			}

			if (v.confirmpwd != v.newpwd) {
				return showToast(that.i18n.confirmMismatch);
			}
			formData.passwordconfirm = v.confirmpwd;

            showLoading(that.i18n.submitting);
            $.post(wapurl+"?c=ajax&a=setpwd",formData,function(data){
                hideLoading();   
                var res = JSON.parse(data);
                if (res.type == 9) {
                    window.localStorage.setItem("socketState", "2");
					window.location.href = 'index.php';
                } else {
                    showToast(res.msg);
                }
            });
               
           
        },
        pageTo:function(url){
            window.location.href = url;
        }
    } 
});
        
</script>
</head>
</body>
