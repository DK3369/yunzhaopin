{yun:}include file="$wapstyle/member/cheader.htm"{/yun}
<div class="none" id="yunvue">
	<!-- Page layout -->
	<div class="issue_post_body">
		<div class="issue_post_body_card">
			<div class="comshowtip">{yun:}t key='wap_01201'{/yun}</div>
			<div class="company_photo_box">
				<van-uploader v-model="showList" :before-delete="beforedel" :after-read="afterRead"
					:before-read="beforeRead" :max-size="5242880" />
			</div>

		</div>
		<div class="Save_button" @click="showSave">{{btext}}</div>
	</div>
</div>
<script src="{yun:}$wap_style{/yun}/js/compressor.min.js?v={yun:}$config.cachecode{/yun}"></script>
<script>
	var uploadArr = [];
	var uploadErr = false;
	new Vue({
		el: '#yunvue',
		data: {
			picDel: [],
			picAdd: [],
			picList: [],
			picViewNum: [],
			btext: '{yun:}t key='wap_user_00101'{/yun}',
			showList: [],
			i18n: {
				save: '{yun:}t key='wap_user_00101'{/yun}',
				reupload: '{yun:}t key='wap_user_00097'{/yun}',
				saveFailed: '{yun:}t key='wap_user_00077'{/yun}',
				saveSuccess: '{yun:}t key='wap_user_00104'{/yun}',
				uploading: '{yun:}t key='wap_user_00244'{/yun}',
				deleting: '{yun:}t key='wap_js_00166'{/yun}',
			},

		},
		created() {
			this.getList();
		},
		methods: {
			getList: function() {
				showLoading();
				var self = this;
				$.post('{yun:}url d=wxapp h=com m=info c=show{/yun}', {
					rand: Math.random()
				}, function(data) {
					hideLoading();

					if (data) {

						let list = data.data.list
						self.picList = list;

						if (list && list.length > 0) {
							let picViewNum = []
							for (let i = 0; i < list.length; i++) {
								picViewNum.push(i)
								let temp = {
									'url': list[i].picurl,
									'id': list[i].id
								};
								self.showList.push(temp);
							}
							self.picViewNum = picViewNum
						}
					}

					$("#yunvue").css('display', 'block');
				}, 'json');
			},
			beforedel(file, detail) {
				var self = this;
				var noupload = true;
				self.picAdd.forEach(function(val,index){
					if(val.index == detail.index){
						noupload = false;
						self.picAdd.splice(index, 1);
					}
				});
				if(noupload){
					self.picDel.push(file);
				}
				return true;
			},
			beforeRead(file) {
				return new Promise((resolve) => {
					new Compressor(file, {
						quality: 0.6,
						success: resolve,
						error(err) {}
					});
				});
			},
			afterRead(file,detail) {
				let obj = {
					error: true,
					url: file.content,
					index: detail.index
				};
				this.picAdd.push(obj);

			},
			showSave: function() {
				let that = this;
				let showAdd = that.picAdd;
				let showDel = that.picDel;
				let saveErr = false;
				if (showAdd.length > 0) {
					uploadArr = showAdd;
					showLoading(that.i18n.uploading);
					that.uploadAjax();
					return false;
				}
				if (showDel.length > 0) {
					var formData = {};
					formData.id = [];
					for (let i = 0; i < showDel.length; i++) {
						if (showDel[i].id) {
							formData.id.push(showDel[i].id);
						}
					}
					showLoading(that.i18n.deleting);
					$.post('{yun:}url d=wxapp h=com m=info c=showdel{/yun}', formData, function(data) {
						if (data.error != 1) {
							saveErr = true;
						}
					});
				}
				
				if (saveErr) {
					that.btext = that.i18n.reupload;
					showToast(that.i18n.saveFailed);
				} else {
					showToast(that.i18n.saveSuccess, 2, function() {
						history.back();
					});
				}
			},
			uploadAjax(key = 0){
				var that = this;
				if(key < uploadArr.length){
					var formData = {
						wappic: 1,
						uimage: uploadArr[key].url
					};
					$.post("{yun:}url d=wxapp h=com m=info c=showSave{/yun}", formData, function(data){
						if (data.error == 1) {
							uploadArr[key].error = false;
										
						} else {
							uploadArr[key].error = true;
							uploadErr = true;
						}
						key++
						that.uploadAjax(key);
					})
				}else{
					this.picAdd = [];
					if(this.picDel.length > 0){
						this.showSave();
					}else{
						if (uploadErr) {
							this.btext = this.i18n.reupload;
							showToast(this.i18n.saveFailed);
						} else {
							showToast(this.i18n.saveSuccess, 2, function() {
								history.back();
							});
						}
					}
				}
			}
		}
	})
</script>
</body>
</html>
