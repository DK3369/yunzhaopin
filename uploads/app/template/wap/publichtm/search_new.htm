<script src="{yun:}$plusstyle{/yun}/city.cache.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$plusstyle{/yun}/cityparent.cache.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$jobplusstyle{/yun}/job.cache.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$jobplusstyle{/yun}/jobparent.cache.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script>
    var searchVue = new Vue({
        el: '#searchhtml',
        data() {
            return {
                historyShow: false,
                historyList: [],
                active: 0,
                jobIndexArr: ji,
                jobNameArr: jn,
                jobTypeArr: jt,
                jobParentArr: job_parent,
                job1: 0,
                job1_son: 0,
                job_post: 0,

                cityIndexArr: ci,
                cityNameArr: cn,
                cityTypeArr: ct,
                cityParentArr: city_parent,
                provinceid: 0,
                cityid: 0,
                three_cityid: 0,


                comData: [],
                comClassName: [],
                upTime: [],
                salaryArr: [],
                exp: '',
                edu: '',
                salary: '',
                pr: '',
                mun: '',
                uptime: '',
                welfare: '',
                classShow: false,

                category: '',

                searchClassVal: '',
                searchClassShow: false,
                searchClassList: [],
                i18n: {
                    searchHistory: "{yun:}t key='wap_00384'{/yun}",
                    selectJob: "{yun:}t key='wap_00093'{/yun}",
                    allJobCategories: "{yun:}t key='wap_00083'{/yun}",
                    selectLocation: "{yun:}t key='wap_00092'{/yun}",
                    nearbyJobsTitle: "{yun:}t key='wap_00084'{/yun}",
                    nearbyJobs: "{yun:}t key='wap_00086'{/yun}",
                    nearbyJobsTip: "{yun:}t key='wap_00079'{/yun}",
                    specificLocationJobs: "{yun:}t key='wap_00081'{/yun}",
                    specificAreaJobsTip: "{yun:}t key='wap_00080'{/yun}",
                    selectBenefits: "{yun:}t key='wap_00094'{/yun}",
                    benefitsJobsTitle: "{yun:}t key='wap_00082'{/yun}",
                    checkSalary: "{yun:}t key='wap_00088'{/yun}",
                    discoverOpportunity: "{yun:}t key='wap_00085'{/yun}",
                    quickMatchTip: "{yun:}t key='wap_00078'{/yun}",
                    viewSalary: "{yun:}t key='wap_00091'{/yun}",
                    education: "{yun:}t key='wap_com_00301'{/yun}",
                    viewEducation: "{yun:}t key='wap_00089'{/yun}",
                    experience: "{yun:}t key='wap_com_00305'{/yun}",
                    viewExperience: "{yun:}t key='wap_00090'{/yun}",
                    more: "{yun:}t key='wap_js_00089'{/yun}",
                    companyType: "{yun:}t key='wap_00087'{/yun}",
                    companySize: "{yun:}t key='wap_com_00163'{/yun}",
                    updateTime: "{yun:}t key='wap_00326'{/yun}",
                    submit: "{yun:}t key='wap_user_00176'{/yun}",
                    historyCleared: "{yun:}t key='wap_00383'{/yun}",
                    actionFailed: "{yun:}t key='wap_js_00141'{/yun}",
                }
            };
        },
        methods: {
            getComData: function() {
                let that = this;
                let paramer = {
                    refer: 'job_search'
                }
                $.post(wapurl + "index.php?c=search&a=getComData", paramer, function(data) {
                    that.comData = data.comData;
                    that.comClassName = data.comClassName;
                    that.upTime = data.upTime;
                    that.salaryArr = data.salaryArr;
                }, 'json');
            },
            getHistory: function() {
                let that = this;
                let paramer = {
                    type: 'job',
                    limit: 8
                }
                $.post(wapurl + "index.php?c=search&a=history", paramer, function(data) {
                    if (data.list.length > 0) {
                        that.historyList = data.list;
                        that.historyShow = true;
                    } else {
                        that.historyList = [];
                        that.historyShow = false;
                    }
                }, 'json');
            },
            clearHis: function() {
                let that = this;
                $.post("index.php?c=search&a=del", { type: 3 }, function(data) {
                    if (data) {
                        showToast(that.i18n.historyCleared, 2);
                        that.historyList = [];
                        that.historyShow = false;
                    } else {
                        showToast(that.i18n.actionFailed);
                        return false;
                    }
                });
            },
            toPage: function(url) {
                location.href = url;
            },
            searchJob: function() {
                var that = this;
                location.href = 'index.php?c=job&minsalary=' + that.salary + '&exp=' + that.exp + '&edu=' + that.edu + '&pr=' + that.pr + '&mun=' + that.mun + '&uptime=' + that.uptime + '&welfare=' + that.welfare;
            },
            setClassShow: function(type) {
                let that = this;
                that.category = type;
                if (type == 'job') {
                    that.job1 = that.jobIndexArr[0];
                } else if (type == 'city') {
                    that.provinceid = that.cityIndexArr[0];
                }
                that.classShow = true;
            },
            bindSearch: function(e) {
                var that = this;
                that.searchClassVal = e.target.value;
                debounce(this.searchClass(that.searchClassVal));
            },
            searchClass: function() {
                var that = this;
                if (that.searchClassVal == '') {
                    that.searchClassShow = false
                } else {
                    var fsn = {},
                        fst = {},
                        fsPar = {},
                        fsTwo = [],
                        fsThr = [],
                        thisClass = [],
                        fsArr = [];

                    if (that.category == 'job') {

                        fsn = that.jobNameArr;
                        fsPar = that.jobParentArr;
                    } else if (that.category == 'city') {

                        fsn = that.cityNameArr;
                        fsPar = that.cityParentArr;
                    }

                    var fsnKeyArr = Object.keys(fsn);
                    if (fsnKeyArr.length > 0) {
                        var inputv = that.searchClassVal.toLowerCase(),
                            itemv = '';

                        for (let key in fsn) {
                            itemv = fsn[key].toLowerCase();
                            if (itemv.indexOf(inputv) != -1) {
                                thisClass.push(key);
                            }
                        }
                    }

                    if (thisClass.length > 0) {
                        for (var i = 0; i < thisClass.length; i++) {
                            var t = thisClass[i];
                            for (var lev = 1; fsPar[t] > 0; t = fsPar[t]) {
                                lev++;
                            }
                            if (lev == 2) {
                                fsTwo.push(thisClass[i]);
                            } else {
                                fsThr.push(thisClass[i]);
                            }
                        }
                        if (fsTwo.length > 0) {
                            for (var m = 0; m < fsTwo.length; m++) {
                                fsArr.push({
                                    "name": fsn[fsTwo[m]],
                                    "two": fsTwo[m],
                                    "one": fsPar[fsTwo[m]],
                                    "fname": fsn[fsPar[fsTwo[m]]]
                                });
                            }
                        }

                        if (fsThr.length > 0) {
                            for (var t = 0; t < fsThr.length; t++) {
                                fsArr.push({
                                    "name": fsn[fsThr[t]],
                                    "value": fsThr[t],
                                    "one": fsPar[fsPar[fsThr[t]]],
                                    "two": fsPar[fsThr[t]],
                                    "fname": fsn[fsPar[fsThr[t]]]
                                });
                            }
                        }
                    }
                    if (fsArr.length > 0) {
                        this.searchClassList = fsArr;
                        this.searchClassShow = true;
                    }
                }
            },
            clearSearch: function() {
                var that = this;
                that.searchClassVal = '';
                that.searchClassShow = false;
            },
            checkClassOne: function(value) {
                var that = this;
                if (that.category == 'job') {
                    that.job1 = value;
                } else if (that.category == 'city') {
                    that.provinceid = value;
                }
            },
            setSearchJobClass: function(one, two, three) {
                var that = this;
                if (that.category == 'job') {

                    that.job1 = one ? one : '';
                    that.job1_son = two ? two : '';
                    that.job_post = three ? three : '';

                    location.href = 'index.php?c=job&job1=' + that.job1 + '&job1_son=' + that.job1_son + '&job_post=' + that.job_post;
                } else if (that.category == 'city') {

                    that.provinceid = one ? one : '';
                    that.cityid = two ? two : '';
                    that.three_cityid = three ? three : '';

                    location.href = 'index.php?c=job&provinceid=' + that.provinceid + '&cityid=' + that.cityid + '&three_cityid=' + that.three_cityid;
                }
            }
        }
    });

    function searchhtmlhide() {
        $("#searchhtml").addClass('none');
        $("#app").removeClass('none');
    }
    $(document).ready(function() {
        $(".searchnew").on('click', function() {
            $("#app").addClass('none');
            $("#searchhtml").removeClass('none');
            searchVue.getHistory();
            searchVue.getComData();
        })
    });



    const targetElement = document.getElementById('scrollBtn'); // Target element
    const targetDistance = 850; // Scroll distance threshold to show target element

    window.addEventListener('scroll', function() {
        const scrollDistance = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollDistance > targetDistance) {
            targetElement.classList.remove('btnhidden');
        } else {
            targetElement.classList.add('btnhidden');
        }
    });

</script>
