<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script data-cfasync="false" src="../../../admin/header.js?v=20260825a"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
    <link rel="stylesheet" href="../../../admin/js/wangeditor/index.css">
    <script src="../../../admin/js/wangeditor/index.js"></script>
</head>

<body>
<div id="cityfl" class="moduleElenAl">
    <div class="moduleSeachs">
        <div class="moduleSeachleft">
            <div class="  newsinput">
                <el-input :placeholder="lc('admin_00340')" size="small" prefix-icon="el-icon-search"
                          v-model="searchForm.keyword" clearable>
                </el-input>
            </div>

            <div class="newsbtnbox">
                <el-button type="primary" icon="el-icon-search" size="mini" @click="search">{{ lc('admin_user_weipin_00049') }}</el-button>

            </div>
        </div>
        <div class="nrtopbtn">
            <el-button type="primary" icon="el-icon-document-add" size="mini"
                       @click="openAdd('')">{{ lc('admin_00222') }}</el-button>
            <el-button type="" size="mini" v-if="pid > 0" @click="childClass(0)">{{ lc('common_02039') }}</el-button>
        </div>
    </div>

    <div class="moduleElTable">
        <el-table :data="list" :default-sort="{prop: 'date', order: 'descending'}" stripe border
                  ref="multipleTable" @selection-change="handleSelectionChange" @sort-change="sortChange" :empty-text="emptytext"
                  style="width: 100%;" :header-cell-style="{ background: '#f5f7fa', color: '#606266' }" height="100%" v-loading="loading">
            <el-table-column type="selection" width="55"> </el-table-column>
            <el-table-column prop="id" :label="lc('member_com_00345')" width="90" sortable="custom">
            </el-table-column>
            <el-table-column prop="name" :label="lc('admin_00223')">
            </el-table-column>
            <el-table-column prop="add_time_n" :label="lc('admin_user_weipin_00030')">
            </el-table-column>
            <el-table-column :label="lc('member_user_00048')" width="200" fixed="right">
                <template slot-scope="scope">
                    <div class="cz_button">
                        <el-button size="mini" plain @click="openManage(scope.row)">{{ lc('wap_com_00304') }}</el-button>
                        <el-button size="mini" plain @click="openAdd(scope.row)">{{ lc('wap_js_00073') }}</el-button>
                        <el-button type="danger" size="mini" @click="del(scope.$index)">{{ lc('wap_js_00077') }}</el-button>
                    </div>
                </template>
            </el-table-column>


        </el-table>
    </div>
    <div class="modulePaging">
        <div class="">
            <el-checkbox v-model="checkedAll" :indeterminate="checkedAllIndeterminate" @change="checkAll">{{ lc('wap_js_00074') }}</el-checkbox>
            <el-button @click="batch('del')" size="mini">{{ lc('member_com_00055') }}</el-button>
        </div>
        <div class="modulePagNum">
            <el-pagination background @size-change="handleSizeChange" @current-change="handleCurrentChange"
                           :current-page="page" :page-sizes="pageSizes" :page-size="limit"
                           layout="total, sizes, prev, pager, next, jumper" :total="total">
            </el-pagination>
        </div>
    </div>

    <div class="modluDrawer">
        <el-drawer :title="detail.id ? lc('admin_00221') : lc('admin_00222')" :visible.sync="drawerAdd" append-to-body :show-close="true"
                   :with-header="true" size="45%">
            <add :refresh="random" :id="detail.id ? detail.id : ''" @child-event="closeAdd"></add>
        </el-drawer>
        <el-drawer :title="lc('admin_00216')" :visible.sync="drawerManage" append-to-body :show-close="true"
                   :with-header="true" @closed="closedManage" size="70%">
            <manage :pid="detail.id"></manage>
        </el-drawer>
    </div>
</div>
</body>
<script>
    const custoapp = new Vue({
        el: '#cityfl',
        data: function () {
            return {
                emptytext: lc('wap_js_00113'),
                loading: false,
                // Search filters
                searchForm: {},

                // List
                page: 1,
                limit: 0,
                list: [],
                total: 0,
                pageSizes: [],

                // List sorting
                t: '',
                order: '',

                checkedAll: false, // Select all
                checkedAllIndeterminate: false,
                multipleSelection: [], // Multi-select value storage
                idArr: [],

                pid: 0, // Parent category ID

                detail: {},

                // Add
                drawerAdd: false,
                random: 0,

                // Manage child categories
                drawerManage: false,
                prevPage:0,

            }
        },
        components: {
            'add': httpVueLoader('./component/class_add.vue'),
            'manage': httpVueLoader('./component/class_manage.vue'),
        },
        created() {
            this.getList();
        },
        methods: {
            handleSizeChange(val) {
                this.limit = val;
                this.getList();
            },
            handleCurrentChange(val) {
                this.page = val;
                this.getList();
            },
            sortChange(event) {
                this.t = event.order ? event.prop : '';
                this.order = event.order ? event.order == 'descending' ? 'desc' : 'asc' : '';
                this.search();
            },
            search() {
                this.page = 1;
                this.getList();
            },
            getList() {
                let that = this,
                    searchForm = that.searchForm,
                    params = {
                        page: that.page,
                        limit: that.limit,
                        t: that.t,
                        order: that.order,
                        pid: that.pid,
                    };
                    that.loading = true;
                    that.emptytext = lc('admin_user_weipin_00026');
                httpPost('m=neirong&c=question_class', {...params, ...searchForm}, {hideloading: true}).then(function (response) {
                    let res = response.data,
                        data = res.data;

                    that.list = data.list;
                    that.total = parseInt(data.total);
                    that.pageSizes = data.page_sizes;
                    if (that.limit === 0) {
                        that.limit = parseInt(data.limit); // Use default count from system config
                    }
                    if (that.page > data.page) {
                        that.page = parseInt(data.page); // Use latest page after the last page is deleted
                    }
                    if(that.prevPage != that.page){
                        that.prevPage = that.page;
                        that.$refs.multipleTable.bodyWrapper.scrollTop = 0;
                    }
                    that.loading = false;
                    if (that.list.length === 0){
                        that.emptytext = lc('wap_js_00113');
                    }
                })
            },

            // Manage child categories
            openManage(row) {
                this.detail = row;
                this.drawerManage = true;
            },
            closedManage() {
                this.getList();
            },

            // Batch operation
            handleSelectionChange(val) {
                if (val.length == 0) {
                    this.checkedAll = false;
                    this.checkedAllIndeterminate = false;
                } else {
                    if (val.length === this.list.length) {
                        this.checkedAll = true;
                        this.checkedAllIndeterminate = false;
                    } else {
                        this.checkedAll = false;
                        this.checkedAllIndeterminate = true;
                    }
                }
                this.multipleSelection = val;
            },
            batch(type) {
                if (this.multipleSelection.length == 0) {
                    let msg = lc('admin_user_weipin_00001')
                    if (type == 'del') {
                        msg = lc('admin_00136')
                    }
                    message.error(msg);
                    return false;
                }

                let idArr = [];
                this.multipleSelection.forEach(function (item) {
                    idArr.push(item.id);
                })
                this.idArr = idArr;

                if (type == 'del') {
                    this.del();
                } else if (type == 'audit') {
                    this.openAudit();
                }
            },
            checkAll(val) {
                val ? this.checkedAllIndeterminate = false : '';
                this.$refs.multipleTable.toggleAllSelection();
            },

            del(idx) {
                let that = this,
                    params = {},
                    msg = '';

                if (typeof idx == 'undefined') { // Batch delete
                    params.del = this.idArr;
                    msg = lc('common_00853');
                } else {// Single delete
                    params.id = that.list[idx].id;
                    msg = lc('admin_00333');
                }
                params.qid = that.id;

                delConfirm(this, params, function (params) {
                    httpPost('m=neirong&c=question_class&a=del', params).then(function (res) {
                        if (res.data.error > 0) {
                            message.error(res.data.msg);
                        } else {
                            message.success(res.data.msg, function () {
                                that.$refs.multipleTable.clearSelection();
                                that.getList();
                            });
                        }
                    })
                }, msg)
            },

            openAdd(row) {
                this.detail = row == '' ? {} : row;
                this.random = Math.floor(Math.random() * 1000);
                this.drawerAdd = true;
            },

            closeAdd() {
                this.drawerAdd = false;
                this.getList();
            },
        }
    });
</script>

</html>
<style>
    .cell span {
        display: flex;
        align-items: center;
    }
</style>
