[package]
name = "phpyun-transport-ws"
version.workspace = true
edition.workspace = true

# WebSocket adapter: authenticated once at the handshake, then a subscription /
# push channel. Not a request/response transport — see the crate docs.
[dependencies]
axum = { workspace = true, features = ["ws"] }
phpyun_core.workspace = true
phpyun_kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
tower.workspace = true
