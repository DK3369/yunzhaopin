{yun:}include file="$wapstyle/member/header.htm"{/yun}
<script>{yun:}include file="$wapstyle/publichtm/wap_api_enum.htm"{/yun}{yun:}include file="$wapstyle/publichtm/wap_js_i18n.htm"{/yun}</script>
<script src="{yun:}$wap_style{/yun}/js/binding.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<div id="yunvue" class="none">
    <form id="binding_form">
		{yun:}if $smarty.get.type=="moblie"{/yun}
        <div class="verification_form">
            <div class="verification_form_Mobile">
                <input type="number" name="moblie" :value="moblie" @input="moblieInput" oninput="value=value.replace(/^0|[\^d]/g,'')" placeholder="{yun:}t key='wap_user_00142'{/yun}" />
            </div>
            <div class="verification_form_Mobile">
                <input type="text" name="authcode" @input="authcodeInput" :value="authcode" placeholder="{yun:}t key='wap_user_00141'{/yun}" style="width: 40%">
                <div class="verification_Mobile_verification">
                    <img id="vcode_img" :src="authcodeUrl" onclick="checkCode('vcode_img');" width="100%" height="100%">
                </div>
            </div>
            <div class="verification_form_code">
                <input type="number" name="code" oninput="value=value.replace(/^0|[\^d]/g,'')" maxlength="6" placeholder="{yun:}t key='wap_user_00143'{/yun}" />
                <div class="verification_form_text" onclick="sendmoblie('vcode_img');" id="time">{yun:}t key='wap_user_00144'{/yun}</div>
            </div>
            <div class="verification_form_btn" onclick="formSubmit()">{yun:}t key='wap_js_00094'{/yun}</div>
        </div>
		{yun:}/if{/yun}
		
		{yun:}if $smarty.get.type=="email"{/yun}
        <div class="verification_form">
            <div class="verification_form_Mobile">
                <input type="text" name="email" :value="email" @input="emailInput" placeholder="{yun:}t key='wap_js_00121'{/yun}">
            </div>
            <div class="verification_form_Mobile">
                <input type="text" name="authcode" @input="authcodeInput" :value="authcode" placeholder="{yun:}t key='wap_user_00141'{/yun}" style="width: 40%">
                <div class="verification_Mobile_verification">
                    <img id="vcode_img" :src="authcodeUrl" onclick="checkCode('vcode_img');" width="100%" height="100%" />
                </div>
            </div>
            <div class="verification_form_btn" onclick="formSubmit()">{yun:}t key='wap_01115'{/yun}</div>
        </div>
		{yun:}/if{/yun}
    </form>
</div>
<input type="hidden" id="send" value="0" />
<script>
    var dsq = [];
    var type = '{yun:}$smarty.get.type{/yun}';
    type = type ? type : 'moblie';
    var BINDING_I18N = {
        fillMobile: '{yun:}t key='wap_01117'{/yun}',
        fillAuthcode: '{yun:}t key='wap_js_00116'{/yun}',
        fillSmsCode: '{yun:}t key='wap_01118'{/yun}',
        fillEmail: '{yun:}t key='wap_01119'{/yun}',
        bindSuccess: '{yun:}t key='wap_user_00145'{/yun}',
        emailSent: '{yun:}t key='wap_01116'{/yun}',
    };
    var yunvue = new Vue({
        el: '#yunvue',
        data: {
            moblie: '',
            email: '',
            authcode: '',
			authcodeUrl: '{yun:}$config.sy_wapdomain{/yun}/authcode.inc.php'
        },
        created() {
            this.getInfo();
        },
        methods: {
            getInfo: function () {
                showLoading();
                var that = this;
                $.post('{yun:}url d=wxapp h=user m=index c=index{/yun}', {rand: Math.random()}, function (data) {
                    hideLoading();
                    that.moblie = data.data.telphone ? data.data.telphone : '';
                    that.email = data.data.email ? data.data.email : '';
                    that.islook = true
                    $("#yunvue").css('display', 'block');
                }, 'json');
            },
            moblieInput: function (e) {
                this.moblie = e.target.value;
            },
            emailInput: function (e) {
                this.email = e.target.value;
            },
            authcodeInput: function (e) {
                this.authcode = e.target.value;
            },
            pageTo: function (url) {
                window.location.href = url;
            }
        }
    });

    function formSubmit() {
        var field = getFormValue('binding_form');
        let paramer = {};
        if (type == 'moblie') {
            if (field.moblie == '') {
                return showToast(BINDING_I18N.fillMobile);
            } else if (!isjsMobile(field.moblie)) {
                return showToast("{yun:}t key='wap_user_00140'{/yun}");
            }
            if (field.authcode == '') {
                return showToast(BINDING_I18N.fillAuthcode);
            }
            paramer['moblie'] = field.moblie;
            if (field.code == '') {
                return showToast(BINDING_I18N.fillSmsCode);
            }
            paramer['code'] = field.code;
        } else if (type == 'email') {
            if (field.email == '') {
                return showToast(BINDING_I18N.fillEmail);
            } else if (!check_email(field.email)) {
                return showToast("{yun:}t key='wap_js_00120'{/yun}");
            }
            if (field.authcode == '') {
                return showToast(BINDING_I18N.fillAuthcode);
            }
            paramer['email'] = field.email;
            paramer['authcode'] = field.authcode;
            paramer['type'] = 'wap';
        }
        if (type == "moblie") {
            var url = '{yun:}url d=wxapp h=user m=set c=bindingbox{/yun}';
            paramer['id'] = 'tel';
        } else {
            var url = '{yun:}url m=wap c=ajax a=emailcert{/yun}';
            paramer['id'] = type;
        }

        showLoading();
        $.post(url, paramer, function (data) {
            hideLoading();
            if (data.error == 1) {
                if (type == 'moblie') {
                    showToast(BINDING_I18N.bindSuccess, 2, function () {
                        goBack();
                    });
                } else if (type == 'email') {
                    showToast(BINDING_I18N.emailSent, 2, function () {
                        goBack();
                    });
                }
            } else {
                if (type == 'email') {
                    checkCode('vcode_img');
                }
                showToast(data.msg);
            }
        }, 'json');
    }
</script>
</body>
</html>
