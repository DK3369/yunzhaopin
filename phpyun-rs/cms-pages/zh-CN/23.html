	<b><span>套餐说明：</span></b> 
</p>
<b> </b>1、年度套餐所有单位的服务期限均为一年；<br />

3、“简历数”是指单位可下载的求职人员简历(不含求职人员主动应聘的简历)，下载简历数每日限300份，每7天限800份，下载简历总数见各套餐简历数。查询简历数量不受限制。<br />

6、会员单位在年度内声明退会的，已交纳的会费不予退还。<br />
