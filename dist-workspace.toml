[workspace]
members = ["cargo:phpyun-rs"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Keep the first release focused: PRs validate the release plan without doing
# an expensive cross-platform build.
pr-run-mode = "plan"
# Ubuntu deployment artifacts use the conventional gzip-compressed tar format.
unix-archive = ".tar.gz"
checksum = "sha256"
# Runtime/deployment inputs that must ship beside the server binary.
include = [
    ".env.pro.example",
    "migrations/sqlx/",
    "deploy/systemd/",
    "deploy/INSTALL.md",
]
