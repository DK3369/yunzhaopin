{yun:}include file="$wapstyle/member/cheader.htm"{/yun}
<script src="{yun:}$wap_style{/yun}/js/compress.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$wap_style{/yun}/js/exif.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>

<script type="text/javascript">
   
	
    function check_company_banner() {
 
        if($.trim($("#pic").val()) == '' && $("#previewimg")[0].src == '') {
            return showToast('{yun:}t key='wap_01200'{/yun}');
           
        }

        showLoading()
        return true;
    }
</script>
<form method="post" action="" onsubmit="return check_company_banner();">
     <div class="yunset_identity_box">
        <div class="yunset_identity">
            <div align="center" class="yunset_identity_pic_img" id="previewshow" {yun:}if !$banner.pic{/yun}style="display: none;" {yun:}/if{/yun}>
				
                <img src="{yun:}if $banner.pic{/yun}{yun:}$banner.pic{/yun}{yun:}/if{/yun}" id="previewimg" />

				
            </div>
			
            <div class="yunset_identity_pic">
                <input type="file" name="pic" id="pic" onchange="previewImage(this,'preview')" accept="image/*" class="yunset_identity_pic_file">
				<input type='hidden' name='preview' value='' id='preview'>
            </div>
            <i class="yunset_identity_pic_tj"></i>
            <div class="yunset_identity_tip">{yun:}t key='wap_com_00033'{/yun}</div>
                  <span class="yunset_identity_tip_a">{yun:}t key='wap_com_00034'{/yun}</span>
        </div>
    </div>
   
    <div class="yunset_identity_msg"><i class="yunset_identity_msg_icon"></i>{yun:}t key='wap_01203'{/yun}{yun:}$config.pic_type{/yun}{yun:}t key='common_01663'{/yun}{yun:}$config.file_maxsize{/yun}M</div>

    <div class="yunset_bth_box">
        <input type="hidden" id="img" value="1">
        <input type="submit" name="submit" value="{yun:}if !$banner.pic{/yun}{yun:}t key='common.save'{/yun}{yun:}else{/yun}{yun:}t key='wap_00225'{/yun}/{yun:}t key='wap_js_00073'{/yun}{yun:}/if{/yun}" class="yunset_bth">
    </div>

</form>
</body>
</html>
