# 现网 test-jobs.ov6.com 切 Nuxt+Rust 用完整 server（T14）
#
# 不删 uploads/；php-fpm 可留着，本 vhost 不再 fastcgi。
# 切站前：本仓库 debug/release 跑 :3003。不要再启 /opt 的 :3000。
# ADMIN_DIST 默认 web/apps/admin/.output/public（nuxt generate）。
# 上传目录 alias 到 uploads/data/upload，不要把 root 指到 PHP 源码树。

upstream phpyun_rs {
    server 127.0.0.1:3003;
}
upstream phpyun_site {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen 443 ssl;
    server_name test-jobs.ov6.com;
    # ssl_certificate / ssl_certificate_key 沿用宝塔证书路径

    client_max_body_size 25m;

    location /v1/ {
        proxy_pass http://phpyun_rs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location /v2/ {
        proxy_pass http://phpyun_rs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location /callback/ {
        proxy_pass http://phpyun_rs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health { proxy_pass http://phpyun_rs; }
    location = /ready { proxy_pass http://phpyun_rs; }

    location /docs/ {
        proxy_pass http://phpyun_rs;
        proxy_set_header Host $host;
    }

    location /api-docs/ {
        proxy_pass http://phpyun_rs;
        proxy_set_header Host $host;
    }

    location /data/upload/ {
        alias /www/wwwroot/zzzz.com/uploads/data/upload/;
    }

    location /api/ {
        proxy_pass http://phpyun_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://phpyun_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
    }
}
