# 前后端分离 Nginx 示例（T14 切换用）
#
# 不要在 PHP 站点验收完成前启用整份配置。
# site：Nuxt SSR Node（默认 3001）
# admin：nuxt generate 静态目录
# rust：phpyun-rs :3003

upstream phpyun_rs {
    server 127.0.0.1:3003;
}
upstream phpyun_site {
    server 127.0.0.1:3001;
}

# 建议：单独 server 或 location 给 /admin 加 IP 白名单
# allow 10.0.0.0/8; deny all;

location /v1/ {
    proxy_pass http://phpyun_rs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 25m;
}

location /v2/ {
    proxy_pass http://phpyun_rs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
}

location /callback/ {
    proxy_pass http://phpyun_rs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /health { proxy_pass http://phpyun_rs; }
location = /ready { proxy_pass http://phpyun_rs; }

location /docs/ {
    proxy_pass http://phpyun_rs;
    proxy_set_header Host $host;
}

location /api-docs/ {
    proxy_pass http://phpyun_rs;
    proxy_set_header Host $host;
}

# 用户上传（Rust STORAGE_FS_ROOT 或继续 data/upload），不要指到 PHP 源码树
# location /data/upload/ {
#     alias @@UPLOAD_ROOT@@/;
# }

location /api/ {
    proxy_pass http://phpyun_site;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
}

location /admin/ {
    alias @@ADMIN_DIST@@/;
    try_files $uri $uri/ /admin/index.html;
}

location / {
    proxy_pass http://phpyun_site;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Cookie $http_cookie;
}
