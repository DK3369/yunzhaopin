<!DOCTYPE html>
<html lang="en">

<head>
    <script data-cfasync="false" src="../../../admin/header.js?v=20260825a"></script>
    <script src="../../../admin/httpVueLoader.js"></script>
</head>

<body>
    <div id="jihuaapp" class="moduleElenAl">
        <div class="setDomeAll">
            <el-tabs v-model="activeName" @tab-click="handleClick">
                <el-tab-pane :label="lc('admin_system_00273')" name="cron">
                    <crontask ref="cron"></crontask>
                </el-tab-pane>
                <el-tab-pane :label="lc('admin_system_00426')" name="log">
                    <tasklog ref="log"></tasklog>
                </el-tab-pane>
            </el-tabs>
        </div>
    </div>
    <!-- script -->
    <script>
    const custoapp = new Vue({
        el: '#jihuaapp',
        data: function() {
            return {
                activeName: 'cron'
            }
        },
        components: {
            'crontask': httpVueLoader('./component/crontask.vue'),
            'tasklog': httpVueLoader('./component/tasklog.vue'),
        },
        created: function() {
            var that = this
            let query = getUrlParams();
            if (query && query.topage) {
                if (query.topage == 2) {
                    that.activeName = 'log'
                }
            }
            setTimeout(() => {
                if (that.activeName == 'cron') {
                    this.$refs.cron.getList();
                } else {
                    this.$refs.log.getList();
                }
            }, 500)
        },
        methods: {
            handleClick(tab) {
                if (tab.name == 'cron') {
                    this.$refs.cron.getList();
                } else if (tab.name == 'log') {
                    this.$refs.log.getList();
                }
            }
        }
    });
    </script>
</body>

</html>
