{yun:}include file="$wapstyle/member/cheader.htm"{/yun}
<link rel="stylesheet" type="text/css" href="{yun:}$wap_style{/yun}/js/webapppic/cropper.css?v={yun:}$config.cachecode{/yun}" />

<script src="{yun:}$wap_style{/yun}/js/alloy/transform.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$wap_style{/yun}/js/alloy/alloy-finger.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$wap_style{/yun}/js/alloy-crop.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$wap_style{/yun}/js/compress.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script src="{yun:}$wap_style{/yun}/js/exif.js?v={yun:}$config.cachecode{/yun}" language="javascript"></script>
<script>
window.COM_PHOTO_I18N = {
    selectLogo: '{yun:}t key='wap_com_00133'{/yun}',
    uploadTip: '{yun:}t key='wap_00840'{/yun}',
    submit: '{yun:}t key='wap_user_00176'{/yun}',
    photoUnchanged: '{yun:}t key='wap_user_00229'{/yun}',
    uploading: '{yun:}t key='wap_user_00244'{/yun}',
    reviewing: '{yun:}t key='wap_user_00174'{/yun}',
    rejected: '{yun:}t key='wap_user_00167'{/yun}',
    approved: '{yun:}t key='wap_user_00165'{/yun}',
    ok: '{yun:}t key='common_02016'{/yun}',
    cancel: '{yun:}t key='wap_js_00080'{/yun}',
};
</script>
<div id="yunvue">
    <div class="clear"></div>
    <div class="verify">
        <div class="photo_i_box_v">
            <div class="photo_i_box_v_c">
                <div id="showResult">
                    <div id="changeAvatar" class="photo_i_box">
                        <img :src="info.logo"
                             onerror="showImgDelay(this,'{yun:}$config.sy_ossurl{/yun}/{yun:}$config.sy_unit_icon{/yun}',2);"
                             width="120" height="120">
                    </div>
                    <div class="clear"></div>
                    <div class="photo_xz">
                        <input id="image" type="file" accept="image/*" onchange="photoChange(this)"/> {{i18n.selectLogo}}

                    </div>
                    <div class="yunset_identity_msg"><i class="yunset_identity_msg_icon"></i>{{i18n.uploadTip}}
                        <span v-if="info.logo_n">
                            (
                            <font v-if="logo_status == '1'" color="#909399">{{i18n.reviewing}}</font>
                            <font v-else-if="logo_status == '2'" color="#F56C6C">{{i18n.rejected}}</font>
                            <font v-else color="#67C23A">{{i18n.approved}}</font>
                            )
                        </span>
                    </div>
                </div>

                <input type="hidden" value="" id="preview">
            </div>
            <div class="photo_tj">
                <input name="submit" type="button" onclick="photo()" :value="i18n.submit" class="yunset_bth"/>
            </div>
        </div>
    </div>
</div>
<script>
    var photoI18n = window.COM_PHOTO_I18N || {};
    var yunvue = new Vue({
        el: '#yunvue',
        data() {
            return {
                logo_status: '',
                info: {},
                i18n: photoI18n,
            };
        },
        created() {
            let that = this;
            $.post('{yun:}url d=wxapp h=com m=info c=getinfo{/yun}', {rand: Math.random()}, function (data) {
                hideLoading();
                let res = data.data;
                that.logo_status = res.logo_status;
                that.info=res;
            }, 'json')
        }
    });
	// Crop logo image
	function toAlloyCrop(pic) {
		new AlloyCrop({
			image_src: pic,
			width: 200,
			height: 200,
			output: 1,
			ok: function (base64, canvas) {
				yunvue.$data.info.logo = base64;
				$("#preview").val(base64);
			},
			cancel: function () {
			},
			ok_text: photoI18n.ok || 'OK',
			cancel_text: photoI18n.cancel || 'Cancel'
		});
	}
    // Upload logo
    function photo() {
        let yd = yunvue.$data;
        var uimage = $("#preview").val();
        if (uimage == '') {
            showToast(photoI18n.photoUnchanged || '');
            return false;
        } else {
            var regS = new RegExp("\\+", "gi");
            uimage = uimage.replace(regS, "#");
            showLoading(photoI18n.uploading || '');
            $.ajax({
                type: 'POST',
                url: '{yun:}url d=wxapp h=com m=info c=savephoto{/yun}',
                cache: false,
                dataType: 'json',
                data: {
                    uimage: uimage,
                    source: 'wap'
                },
                success: function (data) {
                    hideLoading();
                    if (data.error == 1) {
                        showToast(data.msg, 2, function () {
                            $("#preview").val('')
                        });
                    } else {
                        showModal(data.msg);
                    }
                }
            });
        }
    }
</script>
</body>
</html>
