[workspace]
resolver = "2"
members = [
    "crates/platform/core",
    "crates/platform/auth",
    "crates/products/recruit/models",
    "crates/products/recruit/services",
    "crates/products/recruit/api",
    "crates/products/recruit/api-admin",
    "crates/apps/server",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["jobs Team"]
license = "Proprietary"
repository = "https://github.com/DK3369/yunzhaopin"
description = "Rust backend service for PHPYun"

[workspace.dependencies]
# ---- HTTP / Web ----
axum = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = [
    "trace", "cors", "limit", "compression-gzip",
    "request-id", "timeout", "set-header",
] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }

# ---- Async runtime ----
tokio = { version = "1.52", features = [
    "rt-multi-thread", "macros", "sync", "net", "time",
    "signal", "io-util", "fs",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"

# ---- DB / Redis / outbound HTTP ----
sqlx = { version = "0.8", default-features = false, features = [
    "mysql", "runtime-tokio-rustls", "chrono", "migrate", "macros", "json",
] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Process-wide rustls crypto (ring). reqwest 0.13 rustls-no-provider does not install one.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

# ---- Auth ----
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"
md-5 = "0.10"  # 0.11 changed the Digest return type with a costly migration; we keep 0.10 (only used for compat with PHPYun's legacy md5 passwords).
sha1 = "0.10" # WeChat OA signature verification (SHA1(token+timestamp+nonce)).

# ---- Serialization ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- Logging / observability ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }

# ---- Errors ----
anyhow = "1"
# Lock-free atomic Arc swap; used by dict_service's global cache read path, ~10ns and fully lock-free.
arc-swap = "1"

# ---- Internationalization ----
# At compile time, locales/*.json is embedded into the binary's `.rodata` segment;
# zero I/O, zero locking at runtime.
# JSON format: the backend, app, and web frontends can share the same translation files.
# Three languages: zh-CN (default) / zh-TW / en; fallback chain ends at the default locale.
rust-i18n = "3"

# ---- Tools ----
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
dotenvy = "0.15"
cron = "0.16"          # cron expression parsing for the scheduler
async-trait = "0.1"    # used by the storage trait
base64 = "0.22"        # used by idempotency body caching
bytes = "1"            # used by storage writes
captcha = "0.0.9"      # captcha PNG rendering

# ---- Cache ----
moka = { version = "0.12", features = ["future"] }

# ---- Request validation ----
validator = { version = "0.20", features = ["derive"] }

# ---- Testing ----
axum-test = "17"

# ---- OpenAPI auto docs ----
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

# ---- Internal workspace crate aliases (avoid clashing with Rust's built-in `core`) ----
phpyun_core = { path = "crates/platform/core", package = "phpyun-core" }
phpyun_auth = { path = "crates/platform/auth", package = "phpyun-auth" }
phpyun_models = { path = "crates/products/recruit/models", package = "phpyun-models" }
phpyun_services = { path = "crates/products/recruit/services", package = "phpyun-services" }
phpyun_handlers = { path = "crates/products/recruit/api", package = "phpyun-handlers" }
phpyun_api_admin = { path = "crates/products/recruit/api-admin", package = "phpyun-api-admin" }

[workspace.lints.clippy]
as_conversions = "deny"

# Full DWARF across 220+ rlibs makes `ld` peak past the box's available RAM and
# get OOM-killed at the final link. Line tables keep file/line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
