{yun:}include file="$wapstyle/member/header.htm"{/yun} 
<div id="yunvue" class="none">
<div class="m_cardbox">
	<div class="m_cardbg" v-for="(item, lkey) in list" :key="lkey">
	
		
		<div class="sx_new_tit">{yun:}t key='wap_user_00361'{/yun}</div>
		<div class="sx_new_cont">
		
				
							<span v-for="(content, ckey) in item.content_arr" :key="ckey">
								<span v-if="content.url">
									<a href="javascript:void(0)" @click="pageTo(content.url)" class="sys_a">{{content.n}}</a>
								</span>
								<span v-else>
									{{content.n}}
								</span>
							</span>
						
		
		
		</div><div class="sx_new_bot">
	<div class="sx_new_data">{{item.ctime_n}}	</div>
		 <div class="sx_new_icon" @click="delsx(item.id,lkey)">
			<img src="{yun:}$wap_style{/yun}/images/resume_del.png" class="    " />
			
		</div></div>
	</div>
		
	 <div v-if="count==2">
    <van-pagination v-model="page" :total-items="total" :items-per-page="limit" force-ellipses @change="pageChange" /> 
    </div>
     <div class="wap_member_no" v-show="count==0">
        {yun:}t key='wap_com_00020'{/yun}！
      </div>
</div>
</div>

<script>  
  var currentPage = parseInt('{yun:}$smarty.get.page{/yun}');       
      new Vue({
        el: '#yunvue',
        data: {
          list: [],
          limit:20,              
          total:0,
          page: currentPage ? currentPage : 1,
          i18n: {
            confirmDelete: '{yun:}t key='wap_00812'{/yun}',
            deleting: '{yun:}t key='wap_js_00166'{/yun}',
            deleteSuccess: '{yun:}t key='wap_user_00147'{/yun}',
            deleteFailed: '{yun:}t key='wap_user_00146'{/yun}',
          },
        },
        computed: {
          count(){
            if(this.total > this.limit){
              return 2;
            }else if(this.list.length==0){
              return 0;
            }else{
                return 1;
            }
          }
        },
        created() {   
         this.getsixin();
        },
        methods:{          
          getsixin:function(){
            showLoading();
            var that = this;
            var paramer = {};
                paramer['page'] = that.page;
                paramer['type'] = 'wap';
                paramer['limit'] = that.limit;   
            $.post('{yun:}url d=wxapp h=user m=msg c=sxnews{/yun}',paramer,function(res){
                hideLoading();      
                that.list = res.data;
                that.total = res.total;
                that.page = currentPage ? currentPage : 1;
              
               $("#yunvue").css('display', 'block');
            },'json');            
          },
          delsx:function(id,key){
            var that = this;
            var paramer = {
                id: id,                
            };
            showConfirm(that.i18n.confirmDelete,function(){
                showLoading(that.i18n.deleting);
                $.post('{yun:}url d=wxapp h=user m=msg c=delsxnews{/yun}',paramer,function(data){
                    hideLoading();      
                    
                    if (data.error == 1) {
                        showToast(that.i18n.deleteSuccess,2, function() {
                            that.list.splice(key, 1);
                            
                        });
                    } else {
                       showToast(that.i18n.deleteFailed);
                    }
                },'json');  
            })
          },          
          pageChange:function(e){
          
            location.href = 'index.php?c=sxnews&chat=1&page='+e;
          },
          pageTo:function(url){
              window.location.href = url;
          }
        } 
      });
</script>
</body>
</html>
